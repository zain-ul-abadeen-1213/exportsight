{name: Unzip ExportSight, on: {push: {paths: [exportsight-deploy.zip, .github/workflows/unzip.yml]}}, permissions: {contents: write}, jobs: {unzip: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Unpack archive and commit app files, run: "set -e; if [ ! -f exportsight-deploy.zip ]; then echo 'No archive present; nothing to do.'; exit 0; fi; unzip -o exportsight-deploy.zip; rm -f exportsight-deploy.zip; shopt -s dotglob nullglob; mv exportsight/* .; rmdir exportsight; git config user.name 'zain-ul-abadeen-1213'; git config user.email 'zain-ul-abadeen-1213@users.noreply.github.com'; git add -A; git commit -m 'ExportSight v1.0 — initial release'; git push"}]}}}
